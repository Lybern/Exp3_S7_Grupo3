server.port=8080
spring.application.name=core-service

# Seguridad / Service Token compartido con los BFFs
service-token.secret=clave-compartida-bff-bancoxyz-service-token-2026-1234567890

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JMS / Apache ActiveMQ Dockerizado
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.activemq.packages.trust-all=true

# Resilience4j Circuit Breaker (Tolerancia a fallos sobre la mensajería)
resilience4j.circuitbreaker.instances.envioMensajeria.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.envioMensajeria.slidingWindowSize=10
resilience4j.circuitbreaker.instances.envioMensajeria.failureRateThreshold=50
resilience4j.circuitbreaker.instances.envioMensajeria.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.envioMensajeria.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.envioMensajeria.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.envioMensajeria.automaticTransitionFromOpenToHalfOpenEnabled=true

# Resilience4j Retry
resilience4j.retry.instances.envioMensajeria.maxAttempts=3
resilience4j.retry.instances.envioMensajeria.waitDuration=1000

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreaker.enabled=true

# Eureka
eureka.client.service-url.defaultZone=http://eureka:eureka2026@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
