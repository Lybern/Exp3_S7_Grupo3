# Nombre logico del microservicio (debe coincidir con bff-cajero.properties en config-repo)
spring.application.name=bff-cajero

# Conexion al Config Server
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.enabled=true
spring.cloud.config.fail-fast=false

# Credenciales para acceder al Config Server
spring.cloud.config.username=admin
spring.cloud.config.password=gato

# Perfil por defecto
spring.cloud.config.profile=default
